<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Traffic Analytics · Painéis de cliente</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23151311'/><path d='M9 22V10M16 22V14M23 22V18' stroke='%23E31919' stroke-width='3.4' stroke-linecap='round'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBFAF8; --txt:#1A1613; --muted:#6F6A63; --dim:#9B9389;
    --line:#EAE5DD; --line2:#DDD6CB;
    --red:#E31919; --red-050:#FDEFEF; --red-100:#F8DFDF; --red-600:#C41414;
    --dark:#151311; --panel:#fff;
    --f:'Figtree',system-ui,-apple-system,sans-serif;
    --m:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  body{
    background:
      radial-gradient(1100px 420px at 82% -10%, #F5EFE7 0%, transparent 60%),
      radial-gradient(700px 380px at -8% 108%, #F4ECE6 0%, transparent 55%),
      var(--bg);
    color:var(--txt); font-family:var(--f); font-size:14px; line-height:1.55;
    font-feature-settings:'tnum' 1;
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:48px 24px;
  }
  .wrap{width:100%; max-width:860px}

  header{display:flex; align-items:center; gap:16px; margin-bottom:8px}
  .logo{
    width:54px; height:54px; border-radius:14px; background:var(--dark);
    display:grid; place-items:center; flex:none;
    box-shadow:0 10px 24px rgba(21,19,17,.18);
  }
  .logo svg{width:30px; height:30px}
  .htxt{flex:1; min-width:0}
  h1{font-size:24px; font-weight:800; letter-spacing:-.02em; line-height:1.15}
  .sub{font-size:13px; color:var(--muted); margin-top:3px}
  .htag{
    font-family:var(--m); font-size:10px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--muted); border:1px solid var(--line); background:#fff;
    border-radius:999px; padding:6px 11px; white-space:nowrap;
  }

  .advice{font-size:12px; color:var(--dim); margin:20px 2px 12px; display:flex; align-items:center; gap:8px}
  .advice::after{content:''; flex:1; height:1px; background:var(--line)}

  .cards{display:grid; grid-template-columns:repeat(3,1fr); gap:16px}
  @media (max-width:820px){.cards{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}}
  @media (max-width:560px){
    header{gap:12px}
    .logo{width:46px; height:46px; border-radius:13px}
    .logo svg{width:26px; height:26px}
    h1{font-size:20px}
    .sub{font-size:12.5px}
    .htag{display:none}
  }

  a.card{
    display:flex; flex-direction:column; text-decoration:none; color:var(--txt);
    background:var(--panel); border:1px solid var(--line); border-radius:16px;
    padding:20px 20px 16px; position:relative; overflow:hidden;
    transition:transform .16s ease, box-shadow .16s ease, border-color .16s ease;
  }
  a.card:hover{
    border-color:var(--line2); transform:translateY(-3px);
    box-shadow:0 18px 40px rgba(26,22,19,.10);
  }
  a.card:focus-visible{outline:2px solid var(--red); outline-offset:2px}
  a.card::before{
    content:''; position:absolute; inset:0 0 auto 0; height:3px; background:var(--red);
    transform:scaleX(0); transform-origin:left; transition:transform .22s ease;
  }
  a.card:hover::before{transform:scaleX(1)}
  .brow{display:flex; align-items:center; gap:13px; margin-bottom:18px}
  .ini{
    width:48px; height:48px; border-radius:12px; background:var(--dark); color:#fff;
    display:grid; place-items:center; font-family:var(--m); font-weight:700; font-size:15px;
    letter-spacing:.02em; flex:none; position:relative;
  }
  .ini::after{
    content:''; position:absolute; right:-4px; bottom:-4px; width:12px; height:12px;
    border-radius:50%; background:var(--red); border:2px solid var(--panel);
  }
  .brow b{display:block; font-size:17px; font-weight:800; letter-spacing:-.01em; line-height:1.2}
  .brow .dom{
    display:block; font-size:11px; color:var(--muted); font-family:var(--m);
    margin-top:4px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .go{
    display:inline-flex; align-items:center; gap:8px; font-size:12.5px; font-weight:700;
    color:var(--red); margin-top:auto;
  }
  .go svg{transition:transform .16s} a.card:hover .go svg{transform:translateX(3px)}

  .kmeta{
    display:flex; gap:12px; margin-top:14px; padding-top:12px; border-top:1px solid var(--line);
    font-size:10.5px; color:var(--dim); font-family:var(--m); flex-wrap:wrap;
  }
  .kmeta span{display:inline-flex; align-items:center; gap:5px}
  .kmeta i{width:5px; height:5px; border-radius:50%; background:var(--red); opacity:.55; flex:none}

  .banner{
    margin-top:22px; background:#fff; border:1px dashed var(--line2); border-radius:13px;
    padding:14px 18px; font-size:12.5px; color:var(--muted); display:none;
    align-items:center; gap:12px; position:relative; overflow:hidden;
  }
  .banner.on{display:flex}
  .banner b{color:var(--txt)}
  .bar{flex:1; height:3px; background:var(--line); border-radius:99px; overflow:hidden; min-width:60px}
  .bar i{display:block; height:100%; background:var(--red); width:100%; transform-origin:left; animation:drain 2.4s linear forwards}
  @keyframes drain{from{transform:scaleX(1)}to{transform:scaleX(0)}}
  button.cancel{
    background:none; border:0; font:inherit; font-size:11.5px; font-weight:700; color:var(--txt);
    cursor:pointer; text-decoration:underline; flex:none;
  }

  footer{
    margin-top:36px; padding-top:18px; border-top:1px solid var(--line);
    font-size:10.5px; color:var(--dim); font-family:var(--m); letter-spacing:.06em;
    display:flex; justify-content:space-between; gap:12px; text-transform:uppercase;
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="wrap">
  <header>
    <div class="logo"><svg viewBox="0 0 32 32" fill="none"><path d="M9 23V9M16 23V15M23 23V19" stroke="#E31919" stroke-width="3.2" stroke-linecap="round"/></svg></div>
    <div class="htxt">
      <h1>Traffic Analytics</h1>
      <div class="sub">Painéis de monitoramento SEO · escolha o cliente</div>
    </div>
    <span class="htag">V4 · Export &amp; Commerce</span>
  </header>

  <div class="advice">Clientes em monitoramento</div>

  <section class="cards" id="cards"></section>

  <div class="banner" id="redirect">
    <span>Abrindo <b id="rname"></b> em instantes…</span>
    <span class="bar"><i></i></span>
    <button class="cancel" type="button" onclick="stopRedirect()">cancelar</button>
  </div>

  <footer>
    <span>V4 Export &amp; Commerce</span>
    <span id="footn">— clientes ativos</span>
  </footer>
</main>

<script>
const CLIENTS = [
 {
  "slug": "brasland",
  "name": "Brasland",
  "domain": "brasland.com.br",
  "initials": "BR",
  "market": "Brasil · pt",
  "tool": "Ubersuggest"
 },
 {
  "slug": "all-over",
  "name": "All Over",
  "domain": "allovertxroofing.com",
  "initials": "AL",
  "market": "EU · Houston · en",
  "tool": "Ubersuggest"
  },
  {
    "slug": "lola",
    "name": "Lola Aviamentos",
    "domain": "lolaaviamentos.com.br",
    "initials": "LA",
    "market": "Brasil · pt",
    "tool": "Ubersuggest"
  }
];

const $=s=>document.querySelector(s);
const arrow=`<svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M2 8h11M9 3.5 13.5 8 9 12.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

$('#cards').innerHTML=CLIENTS.map(c=>`
  <a class="card" href="${c.slug}/" data-slug="${c.slug}">
    <div class="brow">
      <span class="ini">${c.initials}</span>
      <div><b>${c.name}</b><span class="dom">${c.domain}</span></div>
    </div>
    <span class="go">Abrir painel ${arrow}</span>
    <div class="kmeta"><span><i></i>${c.market}</span><span><i></i>${c.tool}</span></div>
  </a>`).join('');
$('#footn').textContent=`${CLIENTS.length} clientes ativos`;

let timer=null;
function stopRedirect(){
  if(timer){clearTimeout(timer);timer=null;
    const b=$('#redirect');b.classList.remove('on');
  }
}
(function(){
  let slug=null;
  const q=new URLSearchParams(location.search);
  if(q.get('c')&&CLIENTS.some(c=>c.slug===q.get('c')))slug=q.get('c');
  else{
    try{const last=localStorage.getItem('ta-lastclient');
      if(last&&CLIENTS.some(c=>c.slug===last))slug=last;
    }catch(_){}
  }
  if(!slug)return;
  const c=CLIENTS.find(x=>x.slug===slug);
  $('#rname').textContent=`${c.name} (último visitado)`;
  const b=$('#redirect');b.classList.add('on');
  document.body.addEventListener('click',e=>{if(!e.target.closest('#redirect'))stopRedirect()});
  timer=setTimeout(()=>{location.href=c.slug+'/'},2400);
})();
</script>
</body>
</html>
